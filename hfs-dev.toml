standard = "3.0"
project = "xrag"
space = "BlueSkyXN/XRAG"

project_class = "preview"
target_role = "primary"
sovereignty = "port"
lane = "product"
version_source = "commit"

space_visibility = "protected"
bucket_visibility = "private"

env_file = "local/hfs-targets/production.env"
local_only = ["HF_TOKEN", "GH_TOKEN"]
secrets = ["ADMIN_PASSWORD"]
variables = ["ADMIN_USERNAME"]

deviations = [
  "product = This Space runs XRAG's own published image (ghcr.io/blueskyxn/xrag) through a thin wrapper rendered from deploy/hf/; it is not a wrapper around a third-party upstream image.",
  "persistence = SQLite, content cache, and uploaded Markdown live under /data/xrag on a private bucket.",
  "edge-auth = The browser login is the application page, with one username and password. /healthz is public liveness and does not read the database.",
  "scope = Uses the Demo.9 implementation as its baseline. Real Qdrant, Neo4j, commercial models, and live S3/WeKnora are not bundled.",
]
