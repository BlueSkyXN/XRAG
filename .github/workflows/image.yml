name: image

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: xrag-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/blueskyxn/xrag

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: xrag:ci
          build-args: |
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke round 1 - mounted data and password login
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/xrag-data"
          chmod 0777 "$RUNNER_TEMP/xrag-data"
          docker rm -f xrag-ci >/dev/null 2>&1 || true
          docker run -d --name xrag-ci \
            -e ADMIN_USERNAME=ci \
            -e ADMIN_PASSWORD=ci-password-16chars \
            -p 7860:8765 \
            -v "$RUNNER_TEMP/xrag-data:/data" \
            xrag:ci
          dump() { docker logs xrag-ci || true; }
          trap dump EXIT
          ok=0
          for _ in $(seq 1 40); do
            if curl --connect-timeout 1 --max-time 2 -fsS http://127.0.0.1:7860/healthz > "$RUNNER_TEMP/healthz.json" \
              && grep -q "\"commit\":\"${GITHUB_SHA}\"" "$RUNNER_TEMP/healthz.json"; then
              ok=1
              break
            fi
            sleep 2
          done
          test "$ok" = 1
          test "$(curl --connect-timeout 1 --max-time 2 -s -o "$RUNNER_TEMP/home.html" -w '%{http_code}' http://127.0.0.1:7860/)" = 200
          grep -q 'id="root"' "$RUNNER_TEMP/home.html"
          asset="$(grep -o '/assets/index-[A-Za-z0-9_-]*\.js' "$RUNNER_TEMP/home.html" | head -1)"
          test -n "$asset"
          curl --connect-timeout 1 --max-time 5 -fsS "http://127.0.0.1:7860$asset" > "$RUNNER_TEMP/app.js"
          grep -q 'password-form' "$RUNNER_TEMP/app.js"
          grep -q '用户名' "$RUNNER_TEMP/app.js"
          test "$(curl --connect-timeout 1 --max-time 2 -s http://127.0.0.1:7860/v1/login)" = '{"mode":"password"}'
          test "$(curl --connect-timeout 1 --max-time 2 -s -o /dev/null -w '%{http_code}' http://127.0.0.1:7860/v1/system)" = 401
          docker rm -f xrag-ci >/dev/null
          trap - EXIT

      - name: Smoke round 2 - no mount and API key login
        run: |
          set -euo pipefail
          docker rm -f xrag-ci >/dev/null 2>&1 || true
          docker run -d --name xrag-ci -p 7860:8765 xrag:ci
          dump() { docker logs xrag-ci || true; }
          trap dump EXIT
          ok=0
          for _ in $(seq 1 40); do
            if curl --connect-timeout 1 --max-time 2 -fsS http://127.0.0.1:7860/healthz >/dev/null; then
              ok=1
              break
            fi
            sleep 2
          done
          test "$ok" = 1
          test "$(curl --connect-timeout 1 --max-time 2 -s http://127.0.0.1:7860/v1/login)" = '{"mode":"key"}'
          test "$(curl --connect-timeout 1 --max-time 2 -s -o /dev/null -w '%{http_code}' http://127.0.0.1:7860/v1/system)" = 401
          docker rm -f xrag-ci >/dev/null
          trap - EXIT

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push the image (reuses the build cache; same binaries)
        id: push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Write the digest to the job summary
        if: github.event_name != 'pull_request'
        run: |
          {
            echo "## Pushed image"
            echo "- Image: \`${IMAGE_NAME}\`"
            echo "- Digest: \`${{ steps.push.outputs.digest }}\`"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Deploy with: run the \`deploy-hf\` workflow with \`image_digest=${{ steps.push.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
