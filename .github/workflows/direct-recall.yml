name: direct-recall

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'adapters/direct*.go'
      - 'adapters/qdrant.go'
      - 'core/parse.go'
      - 'examples/docs/**'
      - 'examples/eval-questions.json'
      - '.github/workflows/direct-recall.yml'
      - 'scripts/direct_recall_eval.py'

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      qdrant:
        image: qdrant/qdrant:v1.13.6@sha256:bd67306b6cc77c98122cada2321eb60b20d00b19d26cb61c86681e7bd5951498
        ports:
          - 6333:6333
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: true
      - run: sudo apt-get update && sudo apt-get install -y gcc libsqlite3-dev
      - run: make build
      - name: Evaluate Server and direct with real Qdrant and fixed hash vectors
        run: python3 scripts/direct_recall_eval.py --report checks/direct-recall.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: direct-recall-baseline
          path: checks/direct-recall.json
          if-no-files-found: error
