name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: xrag-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: true
      - run: sudo apt-get update && sudo apt-get install -y gcc libsqlite3-dev
      - run: CGO_ENABLED=1 go test ./...
      - run: bash scripts/static-check.sh

  image:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: xrag:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke the built image
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/xrag-data"
          chmod 0777 "$RUNNER_TEMP/xrag-data"
          docker rm -f xrag-ci >/dev/null 2>&1 || true
          docker run -d --name xrag-ci \
            -e ADMIN_USERNAME=ci \
            -e ADMIN_PASSWORD=ci-password-16chars \
            -p 7860:7860 \
            -v "$RUNNER_TEMP/xrag-data:/data" \
            xrag:ci
          dump() { docker logs xrag-ci || true; }
          trap dump EXIT
          ok=0
          for _ in $(seq 1 40); do
            if curl --connect-timeout 1 --max-time 2 -fsS http://127.0.0.1:7860/healthz > "$RUNNER_TEMP/healthz.json" \
              && grep -q '0.8.0-exp.1' "$RUNNER_TEMP/healthz.json"; then
              ok=1
              break
            fi
            sleep 2
          done
          test "$ok" = 1
          test "$(curl --connect-timeout 1 --max-time 2 -s -o "$RUNNER_TEMP/home.html" -w '%{http_code}' http://127.0.0.1:7860/)" = 200
          grep -q 'id="password-form"' "$RUNNER_TEMP/home.html"
          grep -q '用户名' "$RUNNER_TEMP/home.html"
          test "$(curl --connect-timeout 1 --max-time 2 -s http://127.0.0.1:7860/v1/login)" = '{"mode":"password"}'
          test "$(curl --connect-timeout 1 --max-time 2 -s -o /dev/null -w '%{http_code}' http://127.0.0.1:7860/v1/system)" = 401
          docker rm -f xrag-ci >/dev/null
          trap - EXIT

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: image
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --disable-pip-version-check "huggingface_hub[cli]"
      - name: Publish the protected Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          test -n "$HF_TOKEN"
          before="$(hf spaces info BlueSkyXN/XRAG --json | python3 -c 'import json,sys; print(json.load(sys.stdin).get("sha") or "")')"
          hf upload BlueSkyXN/XRAG . \
            --repo-type space \
            --commit-message "Deploy ${GITHUB_SHA}" \
            --exclude ".git/*" \
            --exclude ".github/*" \
            --exclude "local/*" \
            --exclude "data/*"
          for _ in $(seq 1 30); do
            now="$(hf spaces info BlueSkyXN/XRAG --json | python3 -c 'import json,sys; d=json.load(sys.stdin); print((d.get("sha") or "") + " " + ((d.get("runtime") or {}).get("stage") or ""))')"
            case "$now" in
              "$before "*) sleep 5 ;;
              *) break ;;
            esac
          done
          hf spaces wait BlueSkyXN/XRAG --timeout 15m
          ok=0
          for _ in $(seq 1 30); do
            if curl -fsS https://blueskyxn-xrag.hf.space/healthz | grep -q '0.8.0-exp.1'; then
              ok=1
              break
            fi
            sleep 10
          done
          test "$ok" = 1
