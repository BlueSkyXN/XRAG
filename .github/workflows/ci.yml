name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: xrag-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm
          cache-dependency-path: webapp/package-lock.json
      - run: npm ci
        working-directory: webapp
      - run: npm run build
        working-directory: webapp
      - run: npm audit --omit=dev
        working-directory: webapp
      - run: git diff --exit-code -- internal/server/web
      - run: sudo apt-get update && sudo apt-get install -y gcc libsqlite3-dev
      - run: CGO_ENABLED=1 go test ./...
      - run: make build && python3 scripts/smoke_workbench.py
      - run: bash scripts/static-check.sh
