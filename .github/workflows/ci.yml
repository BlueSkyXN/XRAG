name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: xrag-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm
          cache-dependency-path: webapp/package-lock.json
      - run: npm ci
        working-directory: webapp
      - run: npm run build
        working-directory: webapp
      - run: npm audit --omit=dev
        working-directory: webapp
      - run: sudo apt-get update && sudo apt-get install -y gcc libsqlite3-dev
      - run: CGO_ENABLED=1 go test ./...
      - run: python3 -m unittest discover -s scripts -p 'test_package.py'
      - run: make build && python3 scripts/smoke_workbench.py
      - run: bash scripts/static-check.sh
      - name: Verify source and Linux release packages
        run: |
          python3 scripts/package.py --out "$RUNNER_TEMP/xrag-release"
          python3 scripts/check_release.py \
            --source "$RUNNER_TEMP/xrag-release/"*-source.zip \
            --linux "$RUNNER_TEMP/xrag-release/"*-linux-amd64.tar.gz
