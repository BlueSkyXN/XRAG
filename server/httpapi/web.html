<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>XRAG</title>
<style>
  :root { color-scheme: light; --ink:#172026; --line:#d5ddd8; --paper:#f4f7f5; --accent:#0f6e56; }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.45 "IBM Plex Sans", "Source Han Sans SC", sans-serif; color:var(--ink); background:var(--paper); }
  header, main { width:min(1100px, calc(100% - 32px)); margin:0 auto; }
  header { display:flex; justify-content:space-between; align-items:end; padding:22px 0 12px; }
  h1 { margin:0; font-size:28px; letter-spacing:0; }
  p { margin:4px 0 0; color:#4d5b55; }
  form, section { background:white; border:1px solid var(--line); border-radius:8px; padding:14px; }
  .grid { display:grid; grid-template-columns: 280px 1fr; gap:12px; }
  label { display:block; margin:8px 0; font-size:13px; }
  input, button { font:inherit; }
  input { width:100%; border:1px solid #b7c4be; border-radius:6px; padding:8px; background:white; }
  button { border:0; border-radius:6px; padding:8px 12px; background:var(--accent); color:white; }
  button.secondary { background:#31423c; }
  .row { display:flex; gap:8px; align-items:end; }
  .row button { height:38px; }
  article { border-top:1px solid var(--line); padding:10px 0; }
  code { font-family: "IBM Plex Mono", ui-monospace, monospace; font-size:12px; }
  pre { white-space:pre-wrap; margin:6px 0 0; }
  @media (max-width:800px) { .grid { grid-template-columns:1fr; } }
</style>
</head>
<body>
<header>
  <div><h1>XRAG</h1><p>已发布文件版上的目录检索</p></div>
</header>
<main class="grid">
  <form id="side">
    <label>知识库<input id="kb" value="demo" autocomplete="off"></label>
    <label>名称<input id="name" value="Demo" autocomplete="off"></label>
    <div class="row"><button type="button" id="setup">准备</button><button type="button" class="secondary" id="build">构建</button></div>
    <label>Markdown / TXT<input id="file" type="file" accept=".md,.txt,text/plain"></label>
    <button type="button" id="upload">放入语料</button>
    <label>查询<input id="q" autocomplete="off"></label>
    <button type="button" id="search">检索</button>
  </form>
  <section>
    <div id="status"></div>
    <div id="hits"></div>
  </section>
</main>
<script>
const $ = (id) => document.getElementById(id);
const status = (text) => { $.status.textContent = text; };
async function send(url, options) {
  const response = await fetch(url, options);
  const body = await response.json().catch(() => ({}));
  if (!response.ok) throw new Error(body.error || response.statusText);
  return body;
}
function show(data) {
  status(data.action ? data.action + " · " + (data.total ? data.total.value + " " + data.total.unit : "") : "完成");
  $.hits.replaceChildren();
  for (const item of data.items || []) {
    const node = document.createElement("article");
    node.innerHTML = "<div><strong></strong> <code></code></div><pre></pre>";
    node.querySelector("strong").textContent = item.path || "";
    node.querySelector("code").textContent = item.ref || "";
    node.querySelector("pre").textContent = item.text || item.file_hash || "";
    $.hits.append(node);
  }
}
$.setup.onclick = async () => {
  try { await send("/api/setup", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({kb:$.kb.value, name:$.name.value})}); status("知识库已准备"); }
  catch (error) { status(error.message); }
};
$.upload.onclick = async () => {
  const file = $.file.files[0];
  if (!file) { status("先选择文件"); return; }
  const body = new FormData();
  body.set("kb", $.kb.value);
  body.set("file", file);
  try { await send("/api/files", {method:"POST", body}); status("已写入 " + file.name); }
  catch (error) { status(error.message); }
};
$.build.onclick = async () => {
  try { const data = await send("/api/build", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({kb:$.kb.value})}); status("构建 " + data.build_id); }
  catch (error) { status(error.message); }
};
$.search.onclick = async () => {
  try { show(await send("/api/keyword?" + new URLSearchParams({kb:$.kb.value, q:$.q.value}))); }
  catch (error) { status(error.message); }
};
</script>
</body>
</html>
