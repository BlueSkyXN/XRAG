pid /tmp/xrag-nginx/nginx.pid;
worker_processes 1;
error_log /dev/stderr info;
events { worker_connections 256; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    server_tokens off;
    client_body_temp_path /tmp/xrag-nginx/client_body;
    proxy_temp_path /tmp/xrag-nginx/proxy;
    fastcgi_temp_path /tmp/xrag-nginx/fastcgi;
    uwsgi_temp_path /tmp/xrag-nginx/uwsgi;
    scgi_temp_path /tmp/xrag-nginx/scgi;
    server {
        listen 7860;
        listen [::]:7860;
        client_max_body_size 4m;
        location = /healthz {
            proxy_pass http://127.0.0.1:8080/healthz;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            add_header Cache-Control "no-store" always;
        }
        location / {
            proxy_pass http://127.0.0.1:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_buffering off;
            proxy_read_timeout 300s;
        }
    }
}
