<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0c0e11" />
    <script>
      ;(() => {
        try {
          const saved = localStorage.getItem('xrag.theme')
          const preferences = ['system', 'dark', 'light', 'light-color']
          const preference = preferences.includes(saved) ? saved : 'system'
          const light = matchMedia('(prefers-color-scheme: light)').matches
          const theme = preference === 'system' ? (light ? 'light' : 'dark') : preference
          document.documentElement.dataset.theme = theme
          document.documentElement.style.colorScheme = theme === 'dark' ? 'dark' : 'light'

          const sidebar = localStorage.getItem('xrag.sidebar')
          const expanded = sidebar === 'expanded' || sidebar === 'collapsed' ? sidebar : matchMedia('(min-width: 1280px)').matches ? 'expanded' : 'collapsed'
          document.documentElement.dataset.sidebar = expanded
        } catch {
          document.documentElement.dataset.theme = 'dark'
          document.documentElement.dataset.sidebar = 'collapsed'
          document.documentElement.style.colorScheme = 'dark'
        }
      })()
    </script>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23e6e8eb'/%3E%3Cpath d='M10 9l12 14M22 9L10 23' stroke='%230c0e11' stroke-width='3.2' stroke-linecap='round'/%3E%3C/svg%3E" />
    <title>XRAG</title>
  </head>
  <body>
    <div id="root"></div>
    <noscript>XRAG 工作台需要启用 JavaScript。</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
